    function start() {
      if (!sel || S.rigs[sel]) return;
      const p = ($("#sp")?.value || "").trim();
      if (!/^\d{10}$/.test(p)) return toast("10-digit phone needed.");

      const existingRig = Object.entries(S.rigs).find(([, r]) => r.c === p);
      if (existingRig) {
        return toast(`Player is already active on ${existingRig[0]}.`);
      }

      let c = S.cust[p];
      if (!c) {
        const n = ($("#sn")?.value || "").trim().slice(0, 40);
        if (!n) return toast("New player: add a name.");
        c = S.cust[p] = createBlankCustomer(n, "0000");
      }

      const k = sel.startsWith("PS5")
        ? Math.min(4, Math.max(1, Math.round(Number($("#sk")?.value) || 2)))
        : 1;
      const vr2 = sel.startsWith("SIM") ? Boolean($("#svr2")?.checked) : false;
      const grp = sel.startsWith("PC") ? Boolean($("#sgrp")?.checked) : k >= 4;

      let startTs = now();
      let endTs = null;
      const stVal = ($("#staff-start-time")?.value || "").trim();
      const etVal = ($("#staff-end-time")?.value || "").trim();
      if (/^\d{2}:\d{2}$/.test(stVal)) {
        const [sh, sm] = stVal.split(":").map(Number);
        const sd = new Date(now());
        sd.setHours(sh, sm, 0, 0);
        startTs = +sd;
      }
      if (/^\d{2}:\d{2}$/.test(etVal)) {
        const [eh, em] = etVal.split(":").map(Number);
        const ed = new Date(startTs);
        ed.setHours(eh, em, 0, 0);
        if (+ed <= startTs) ed.setDate(ed.getDate() + 1);
        endTs = +ed;
      }
      DB.startSession(sel, { c: p, s: startTs, e: endTs, k, vr2, grp, sn: 0, items: [], prepaid: 0 });
      render();
    }

    function seatBooking(bookingId) {
      const b = S.book.find((item) => item.id === bookingId && !item.seated);
      if (!b) return toast("Booking not found or already seated.");

      const freeRig = RIGS.find((r) => r[1] === b.ty && !S.rigs[r[0]]);
      if (!freeRig) return toast(`No free ${b.ty.toUpperCase()} station right now.`);

      const rigId = freeRig[0];
      S.rigs[rigId] = {
        c: b.p,
        s: now(),
        k: b.ty === "ps" ? Math.min(4, Math.max(1, b.k || 1)) : 1,
        vr2: Boolean(b.vr2),
        grp: Boolean(b.grp),
        sn: 0,
        items: [],
        prepaid: b.prepaid || 0
      };
      b.seated = true;
      sel = rigId;
      save();
      toast(`Seated ${b.n} on ${rigId}.`);
      render();
    }

    function end(m) {
      if (!sel || !S.rigs[sel]) return;
      const s = S.rigs[sel];
      const c = S.cust[s.c];
      const b = bill(sel);

      let paid = b.t;
      if (m === "wallet") {
        paid = Math.min(c.w, b.t);
        c.w -= paid;
      }
      const due = b.t - paid;

      c.pass = Math.max(0, (c.pass || 0) - b.u);
      if (b.usedWheelCoupon) {
        c.cp = Math.max(0, (c.cp || 0) - 1);
      }

      c.v++;
      c.h += b.m / 60;
      const unlockedNotes = [];

      const spinsEarned = Math.min(3, Math.floor(b.m / 60));
      if (spinsEarned > 0) {
        c.sp = (c.sp || 0) + spinsEarned;
        unlockedNotes.push(`+${spinsEarned} Spin(s)`);
      }

      if (b.m >= 180) {
        c.pass = (c.pass || 0) + 15;
        unlockedNotes.push("+15m HH Pass (3h Milestone)");
      }

      c.wkMins = (c.wkMins || 0) + b.m;
      let cratesEarned = 0;
      while (c.wkMins >= 300) {
        c.wkMins -= 300;
        cratesEarned++;
      }
      if (b.m >= 300 && cratesEarned === 0) {
        cratesEarned = 1;
      }
      if (cratesEarned > 0) {
        c.drops = (c.drops || 0) + cratesEarned;
        unlockedNotes.push(`+${cratesEarned} VoidZone Drop Crate (5h Milestone!)`);
      }

      const currentDay = day();
      const last = c.last;
      const y = day(now() - 864e5);
      if (last !== currentDay) {
        c.st = last === y ? (c.st || 0) + 1 : (c.sh || 0) > 0 ? (c.sh--, (c.st || 0) + 1) : 1;
        c.last = currentDay;

        if (c.st === 3) {
          c.pass = (c.pass || 0) + 15;
          unlockedNotes.push("Day 3 Streak: +15m Bonus HH Pass!");
        } else if (c.st === 5) {
          c.sp = (c.sp || 0) + 1;
          unlockedNotes.push("Day 5 Streak: +1 Free Cyber Spin!");
        } else if (c.st >= 7) {
          c.drops = (c.drops || 0) + 1;
          c.weeksCompleted = (c.weeksCompleted || 0) + 1;
          c.st = 0;
          if (S.economy.spinReserve >= 50 && S.given + 50 <= cap()) {
            c.w += 50;
            recordRewardSpend("spin", 50, 50);
            unlockedNotes.push("Day 7 Weekly Streak Complete: +1 Drop Crate & +₹50 Wallet!");
          } else {
            c.pass = (c.pass || 0) + 60;
            recordRewardSpend("zero", 0, 80);
            unlockedNotes.push("Day 7 Weekly Streak Complete: +1 Drop Crate & +60m Happy-Hr Pass!");
          }
        }
      }

      const collectedRatio = b.grossTotal > 0 ? (paid + b.prepaidUsed) / b.grossTotal : 0;
      accrueProfitToEconomy(b.netPlay * collectedRatio, b.sn * collectedRatio, 0);

      S.log.push({
        t: new Date(now()).toISOString(),
        id: sel,
        n: c.n,
        p: s.c,
        m: b.m,
        playRev: b.netPlay,
        foodRev: b.sn,
        total: b.grossTotal,
        pay: m,
        due
      });
      if (S.log.length > MAX_LOG_ENTRIES) {
        S.log = S.log.slice(-MAX_LOG_ENTRIES);
      }

      delete S.rigs[sel];
      sel = null;
      save();
      const milestoneStr = unlockedNotes.length ? ` | Unlocked: ${unlockedNotes.join(", ")}` : "";
      toast((due ? `Closed (${rs(due)} due)` : "Session closed") + milestoneStr);
      render();
    }

    function topup() {
      const p = ($("#tp")?.value || "").trim();
      const rawAmt = Number($("#ta")?.value);
      const a = Math.round(rawAmt);
      if (!/^\d{10}$/.test(p) || !Number.isFinite(a) || a < 10 || a > 50000) {
        return toast("Enter a 10-digit phone and amount between ₹10 and ₹50,000.");
      }
      let c = S.cust[p];
      if (!c) {
        const n = ($("#tn")?.value || "").trim().slice(0, 40);
        const pinVal = ($("#tpin")?.value || "").trim();
        if (!n) return toast("New player: add a name.");
        c = S.cust[p] = createBlankCustomer(n, pinVal, p);
        CafeBridge.enqueueMemberUpsert(p);
      }
      DB.updateBalance(p, a, "TOPUP", "desk", "Staff Desk Wallet Top-Up");
      toast(`${rs(a)} added for ${c.n} (@${c.member_account}) & queued to iCafeCloud!`);
      render();
    }

    function buyMembershipPass(payMethod) {
      const p = ($("#mp-phone")?.value || "").trim();
      const tierId = $("#mp-tier")?.value || "silver";
      if (!/^\d{10}$/.test(p)) return toast("Enter a valid 10-digit customer phone.");

      const c = S.cust[p];
      if (!c) return toast("Customer not found. Register them via Top-up or Session Start first.");

      const tObj = TIERS.find((t) => t.id === tierId);
      if (!tObj || tObj.passPrice <= 0) return;

      if (payMethod === "wallet") {
        if (c.w < tObj.passPrice) {
          return toast(`Wallet has ${rs(c.w)}, need ${rs(tObj.passPrice)} for ${tObj.name}.`);
        }
        c.w -= tObj.passPrice;
      }

      c.passTier = tObj.id;
      c.passExp = now() + 30 * 864e5;
      accrueProfitToEconomy(0, 0, tObj.passPrice);

      if (tObj.id === "gold") {
        c.sp = (c.sp || 0) + 1;
      } else if (tObj.id === "radiant") {
        c.drops = (c.drops || 0) + 1;
        c.sp = (c.sp || 0) + 1;
      }

      save();
      toast(
        `Activated ${tObj.name} Pass (30d) for ${c.n} via ${payMethod}!` +
          (tObj.id === "radiant" ? " (+1 Drop Crate & +1 Spin granted!)" : "")
      );
      render();
    }

    function sanitizeCsvCell(val) {
      let str = String(val ?? "");
      if (/^[=+\-@\t\r]/.test(str)) {
        str = "'" + str;
      }
      if (/[",\n\r]/.test(str)) {
        return '"' + str.replace(/"/g, '""') + '"';
      }
      return str;
    }

    function buildCsvString() {
      const header = "time,station,player,phone,minutes,play_inr,cooler_inr,total_bill,paid_by,due";
      const rows = S.log.map((l) =>
        [l.t, l.id, l.n, l.p, l.m, l.playRev ?? l.total, l.foodRev || 0, l.total, l.pay, l.due]
          .map(sanitizeCsvCell)
          .join(",")
      );
      return [header, ...rows].join("\n");
    }

    function showCsv() {
      const container = $("#csv");
      if (!container) return;
      container.innerHTML = "";
      const ta = document.createElement("textarea");
      ta.readOnly = true;
      ta.value = buildCsvString();
      container.appendChild(ta);
    }

    function downloadCsv() {
      const csvText = buildCsvString();
      const blob = new Blob([csvText], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `voidzone-mazgaon-sessions-${new Date(now()).toISOString().slice(0, 10)}.csv`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      toast("Downloaded VoidZone Mazgaon session log CSV.");
    }

    document.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-action]");
      if (!btn) return;
      if (ok) staffLastActive = Date.now();

      const action = btn.getAttribute("data-action");
      switch (action) {
        case "switch-staff-tab":
          S.staffSubTab = btn.getAttribute("data-tab") || "master_log";
          render();
          break;
        case "quick-tender-amount": {
          const amt = Number(btn.getAttribute("data-amt")) || 0;
          if (!S.masterFormDraft) S.masterFormDraft = {};
          S.masterFormDraft.cashGiven = amt;
          const draft = S.masterFormDraft;
          const dateVal = draft.date || "2026-03-18";
          const cName = draft.customer || "Rahul";
          const consoleVal = draft.console || "PC-1";
          const tinVal = draft.timeIn || "11:20";
          const toutVal = draft.timeOut || "16:20";
          const catVal = draft.category || "Auto";
          const ctrlVal = Number(draft.controllers || 1);
          const effectiveCategory = catVal === "Auto" ? excelDetectCategory(tinVal, toutVal) : catVal;
          const calc = excelCalcGameCharges(consoleVal, tinVal, toutVal, effectiveCategory, ctrlVal);
          const attachedSnacks = (S.snackLog || []).filter(s => s.date === dateVal && s.txId.includes(cName)).reduce((sum, s) => sum + s.total, 0);
          const totalBill = calc.gameCharges + attachedSnacks;
          draft.cash = Math.min(amt, totalBill);
          render();
          const smart = computeSmartChange(Math.max(0, amt - draft.cash));
          toast(`Tendered ${rs(amt)}. Change: ${rs(Math.max(0, amt - draft.cash))} (${smart.formatted})`);
          break;
        }
        case "calc-quick-tender": {
          const amt = Number(btn.getAttribute("data-amt")) || 0;
          if (!S.cashCalcDraft) S.cashCalcDraft = { bill: 160, tender: 500 };
          S.cashCalcDraft.tender = amt;
          render();
          break;
        }
        case "adjust-denom": {
          const val = Number(btn.getAttribute("data-val"));
          const delta = Number(btn.getAttribute("data-delta")) || 0;
          const cd = getCashDrawerState();
          cd.notes[val] = Math.max(0, (Number(cd.notes[val]) || 0) + delta);
          save();
          render();
          break;
        }
        case "set-denom-zero": {
          const val = Number(btn.getAttribute("data-val"));
          const cd = getCashDrawerState();
          cd.notes[val] = 0;
          save();
          render();
          break;
        }
        case "save-till-snapshot": {
          const cd = getCashDrawerState();
          const physical = computePhysicalCashTotal(cd.notes);
          const expected = computeExpectedCashInTill();
          const variance = physical - expected;
          const statusStr = variance === 0 ? "BALANCED" : variance > 0 ? "SURPLUS" : "SHORTAGE";
          const nowD = new Date(now());
          const tsStr = `${nowD.toISOString().slice(0, 10)} ${String(nowD.getHours()).padStart(2, "0")}:${String(nowD.getMinutes()).padStart(2, "0")}:${String(nowD.getSeconds()).padStart(2, "0")}`;
          const id = `TILL-${nowD.toISOString().slice(0, 10).replace(/-/g, "")}-${String((cd.ledger || []).length + 1).padStart(2, "0")}`;

          if (!Array.isArray(cd.ledger)) cd.ledger = [];
          cd.ledger.push({
            id,
            ts: tsStr,
            staff: staffRole === "owner" ? "OWNER_9999" : "STAFF_1234",
            openingFloat: Number(cd.openingFloat) || 2000,
            cashReceived: (S.masterLog || []).reduce((sum, r) => sum + (Number(r.cash) || 0), 0),
            cashPayouts: Number(cd.cashPayouts) || 0,
            physicalCash: physical,
            expectedCash: expected,
            variance,
            status: statusStr,
            notes: { ...cd.notes },
            remark: `Shift till saved: ${statusStr} (${variance >= 0 ? '+' : ''}${rs(variance)})`
          });

          // Non-blocking sync to Edge D1
          fetch("/api/cash-drawer", {
            method: "POST",
            headers: { "Content-Type": "application/json", "X-VZ-Pin": staffRole === "owner" ? "9999" : "1234" },
            body: JSON.stringify({
              id,
              staff: staffRole === "owner" ? "OWNER_9999" : "STAFF_1234",
              openingFloat: cd.openingFloat,
              physicalCash: physical,
              expectedCash: expected,
              variance,
              notes: cd.notes
            })
          }).catch(() => {});

          save();
          render();
          toast(`✅ Saved Shift Till Snapshot ${id}! Status: ${statusStr} (${variance >= 0 ? '+' : ''}${rs(variance)})`);
          break;
        }
        case "reset-till-to-expected": {
          const cd = getCashDrawerState();
          const expected = computeExpectedCashInTill();
          // Greedy fill of expected into notes
          let rem = expected;
          cd.notes = { 500: 0, 200: 0, 100: 0, 50: 0, 20: 0, 10: 0, 5: 0, 2: 0, 1: 0 };
          for (const d of INR_DENOMINATIONS) {
            if (rem >= d.val) {
              const count = Math.floor(rem / d.val);
              cd.notes[d.val] = count;
              rem -= count * d.val;
            }
          }
          save();
          render();
          toast(`Reset denomination notes to match Expected Cash (${rs(expected)}).`);
          break;
        }
        case "submit-cash-payout": {
          const cd = getCashDrawerState();
          const pEl = $("#payout-amount-input");
          const amt = Math.max(0, Number(pEl ? pEl.value : 0) || 0);
          if (amt <= 0) return toast("Enter a valid petty cash payout amount.");
          cd.cashPayouts = (Number(cd.cashPayouts) || 0) + amt;
          save();
          render();
          toast(`Recorded petty cash payout: ${rs(amt)}.`);
          break;
        }
        case "desk-set-duration": {
          const dur = Number(btn.getAttribute("data-dur")) || 2;
          if (!S.deskBookingDraft) S.deskBookingDraft = {};
          S.deskBookingDraft.durationHours = dur;
          const st = S.deskBookingDraft.startTime || "14:00";
          const [sh, sm] = st.split(":").map(Number);
          const eh = (sh + dur) % 24;
          S.deskBookingDraft.endTime = `${String(eh).padStart(2, "0")}:${String(sm).padStart(2, "0")}`;
          render();
          break;
        }
        case "desk-quick-tender": {
          const amt = Number(btn.getAttribute("data-amt")) || 0;
          if (!S.deskBookingDraft) S.deskBookingDraft = {};
          S.deskBookingDraft.cashTendered = amt;
          render();
          break;
        }
        case "dismiss-desk-pass":
          S.latestDeskPass = null;
          render();
          break;
        case "copy-desk-login": {
          const text = btn.getAttribute("data-text") || "";
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(() => toast("Copied gamer login credentials to clipboard!"));
          } else {
            toast("Gamer credentials ready.");
          }
          break;
        }
        case "print-desk-pass":
          window.print();
          break;
        case "seat-booking-direct": {
          const bId = btn.getAttribute("data-id");
          const b = S.book.find(item => item.id === bId);
          if (!b) return toast("Booking not found.");
          const targetStation = b.stationId && b.stationId !== "ANY" ? b.stationId : (b.ty === "ps" ? "PS-1" : b.ty === "sim" ? "SIM-1" : "PC-1");
          if (S.rigs[targetStation]) {
            return toast(`Station ${targetStation} is currently occupied! End session first or reassign.`);
          }
          S.rigs[targetStation] = {
            c: b.p,
            s: now(),
            k: b.k || 1,
            vr2: Boolean(b.vr2),
            grp: Boolean(b.grp),
            sn: 0,
            items: [],
            prepaid: b.estCost || 0
          };
          b.seated = true;
          sel = targetStation;
          save();
          render();
          toast(`Seated ${b.n} on ${targetStation}! Session stopwatch started.`);
          break;
        }
        case "reissue-pass": {
          const bId = btn.getAttribute("data-id");
          const b = S.book.find(item => item.id === bId);
          if (b) {
            const cust = S.cust[b.p] || { member_account: sanitizeMemberAccount(b.n, b.p), pin: "0000" };
            const clipText = `🎮 VoidZone Mazgaon - Station Login Pass\nStation: ${b.stationId}\nPlayer: ${b.n}\nGamerTag / Login: ${cust.member_account}\nPIN: ${cust.pin || "0000"}\nSession Window: ${fmtSlotTime(b.h)} - ${fmtSlotTime(b.h + b.d)} (${b.d}h)\nBilling: ${esc(b.pay)}`;
            const waUrl = `https://wa.me/91${b.p}?text=${encodeURIComponent(clipText)}`;
            S.latestDeskPass = {
              stationId: b.stationId || "PC-1",
              stationName: b.stationId?.startsWith("PS") ? "PS5 Lounge Pod" : b.stationId?.startsWith("SIM") ? "Pro Racing Simulator" : "RTX 4060 Esports Station",
              name: b.n,
              phone: b.p,
              username: cust.member_account,
              pin: cust.pin || "0000",
              timeStr: `${fmtSlotTime(b.h)} – ${fmtSlotTime(b.h + b.d)} (${b.d}h)`,
              billStr: esc(b.pay),
              changeStr: "",
              clipText,
              waUrl
            };
            render();
            toast(`Re-displayed Desk Login Pass for ${b.n}.`);
          }
          break;
        }
        case "cancel-booking-slot": {
          const bId = btn.getAttribute("data-id");
          const idx = S.book.findIndex(item => item.id === bId);
          if (idx !== -1) {
            const b = S.book[idx];
            if (b.stationId && S.rigs[b.stationId] && S.rigs[b.stationId].c === b.p) {
              delete S.rigs[b.stationId];
            }
            S.book.splice(idx, 1);
            save();
            render();
            toast(`Released booking ${bId} and unblocked station.`);
          }
          break;
        }
        case "submit-desk-booking": {
          const draft = S.deskBookingDraft || {};
          const station = draft.station || "PC-1";
          const rawPhone = (draft.phone || "").trim().replace(/\D/g, "");
          const phone = rawPhone.length >= 10 ? rawPhone.slice(-10) : rawPhone;
          const name = (draft.customer || "Gamer").trim();
          const pin = (draft.pin || "0000").trim() || "0000";
          const st = draft.startTime || "14:00";

      const el = e.target.closest("[data-action]");
      if (!el) return;
      if (ok) staffLastActive = Date.now();

      const action = el.getAttribute("data-action");

      if (action === "desk-book-cust-select") {
        const phone = el.value;
        if (!S.deskBookingDraft) S.deskBookingDraft = {};
        if (phone && phone !== "new" && S.cust[phone]) {
          const c = S.cust[phone];
          S.deskBookingDraft.customer = c.n;
          S.deskBookingDraft.phone = phone;
          S.deskBookingDraft.pin = c.pin || "0000";
        }
        render();
        return;
      } else if (action === "desk-book-input") {
        const field = el.getAttribute("data-field");
        if (!S.deskBookingDraft) S.deskBookingDraft = {};
        if (el.type === "checkbox") {
          S.deskBookingDraft[field] = Boolean(el.checked);
        } else {
          S.deskBookingDraft[field] = el.value;
        }
        render();
        return;
      } else if (action === "denom-input") {
        const val = Number(el.getAttribute("data-val"));
        const cd = getCashDrawerState();
        cd.notes[val] = Math.max(0, Number(el.value) || 0);
        save();
        render();
        return;
      } else if (action === "calc-input") {
        const field = el.getAttribute("data-field");
        if (!S.cashCalcDraft) S.cashCalcDraft = { bill: 160, tender: 500 };
        S.cashCalcDraft[field] = Math.max(0, Number(el.value) || 0);
        render();
        return;
      } else if (action === "ml-filter-date") {
        S.mlFilterDate = el.value || "";
        render();
        return;
      } else if (action === "ml-filter-query") {
        S.mlFilterQuery = el.value || "";
        render();
        return;
      } else if (action === "daily-date-picker") {
        S.dailyReportDate = el.value;
        save();
        render();
        return;
      } else if (action === "monthly-date-picker") {
        S.monthlyReportDate = el.value;
        save();
        render();
        return;
      } else if (action === "master-input") {
        const field = el.getAttribute("data-field");
        if (!S.masterFormDraft) S.masterFormDraft = {};
        S.masterFormDraft[field] = el.value;
        save();
        render();
        return;
      } else if (action === "book-apply-disc") {
        bk.applyDisc = Boolean(el.checked);
        render();
        return;
      } else if (action === "cafe-apply-disc") {
        cafeOrder.applyDisc = Boolean(el.checked);
        render();
        return;
      }

      if (action === "pod-time-part") {
        const which = el.getAttribute("data-which");
        const part = el.getAttribute("data-part");
        const isEnd = which === "end";
        const curH = isEnd ? (bk.h ?? 13) + (bk.d || 2) : (bk.h ?? 13);
        const p = hValToParts(curH);
        const nextHr12 = part === "hr" ? Number(el.value) : p.hr12;
        const nextMin = part === "min" ? Number(el.value) : p.mins;
        const nextOpH = partsToOpHour(nextHr12, nextMin, p.ampm, isEnd);
        if (isEnd) {
          const sH = bk.h ?? 13;
          const eH = nextOpH <= sH ? Math.min(26, sH + 0.5) : nextOpH;
          applyBookingTimeWindow(hValToTimeStr(sH), hValToTimeStr(eH), false);
        } else {
          const sH = nextOpH;
          let eH = (bk.h ?? 13) + (bk.d || 2);
          if (eH <= sH) eH = Math.min(26, sH + (bk.d || 2));
          applyBookingTimeWindow(hValToTimeStr(sH), hValToTimeStr(eH), false);
        }
        render();
      } else if (action === "book-hours") {
        bk.d = Math.min(12, Math.max(0.25, Number(el.value) || 2));
        if (bk.h != null) {
          bk.startTime = hValToTimeStr(bk.h);
          bk.endTime = hValToTimeStr(bk.h + bk.d);
        }
        render();
      } else if (action === "home-calc-type") {
        bk.ty = el.value;
        render();
      } else if (action === "book-filter-hour") {
        bk.filterH = el.value;
        render();
      } else if (action === "book-custom-time" || action === "home-start-time") {
        const startVal = el.value;
        const endVal = $("#book-end-time")?.value || $("#home-end-time")?.value || bk.endTime;
        applyBookingTimeWindow(startVal, endVal, false);
        render();
      } else if (action === "book-end-time" || action === "home-end-time") {
        const startVal = $("#book-custom-time")?.value || $("#home-start-time")?.value || bk.startTime;
        const endVal = el.value;
        applyBookingTimeWindow(startVal, endVal, false);
        render();
      } else if (action === "book-controllers") {
        bk.k = Math.min(4, Math.max(1, Number(el.value) || 2));
        render();
      } else if (action === "book-vr2") {
        bk.vr2 = Boolean(el.checked);
        render();
      } else if (action === "book-grp") {
        bk.grp = Boolean(el.checked);
        render();
      } else if (action === "cafe-target") {
        cafeOrder.rigId = el.value;
        render();
      } else if (action === "service-ping-rig") {
        servicePingRig = el.value;
      } else if (action === "party-branch") {
        partyCfg.branch = el.value;
        render();
      } else if (action === "party-guests") {
        partyCfg.guests = Number(el.value) || 10;
        render();
      } else if (action === "party-hrs") {
        partyCfg.hrs = Number(el.value) || 3;
        render();
      } else if (action === "party-chiller") {
        partyCfg.chiller = Boolean(el.checked);
        render();
      } else if (action === "rev-edit") {
        const field = el.getAttribute("data-field");
        if (field && field in S.economy) {
          S.economy[field] = Math.max(0, Number(el.value) || 0);
          recalcEconomyBounds();
          save();
          render();
        }
      } else if (action === "opex-edit") {
        const field = el.getAttribute("data-field");
        if (field && field in S.opex) {
          S.opex[field] = Math.max(0, Number(el.value) || 0);
          recalcEconomyBounds();
          save();
          render();
        }
      } else if (action === "cfg-pct") {
        S.cfg.pct = clampRewardPct(el.value);
        recalcEconomyBounds();
        save();
        render();
      } else if (action === "cfg-skin-quota") {
        const q = Math.min(10, Math.max(0, Math.floor(Number(el.value) || 0)));
        S.monthlyDropPool.skinsRemaining = q;
        S.monthlyDropPool.skinsQuota = Math.max(S.monthlyDropPool.skinsQuota, q);
        save();
        render();
      }
    });

    document.addEventListener("input", (e) => {

      if (e.target.id === "bp") {
        bk.phone = e.target.value.trim();
        const cardWrap = $("#book-est-card-wrap");
        if (cardWrap) {
          cardWrap.innerHTML = renderBookEstimateCard();
        }
        const c = S.cust[bk.phone];
        if (c && !bk.name) {
          bk.name = c.n;
          const bnEl = $("#bn");
          if (bnEl && !bnEl.value) bnEl.value = c.n;
        }
        const tObj = tierObjOf(c);
        const curEst = estBreakdown(bk.h, bk.phone);
        const walletBtn = $("#book-btn-wallet");
        const deskBtn = $("#book-btn-desk");
        if (walletBtn) {
          walletBtn.textContent = `Pay from wallet${bk.h != null ? ` (${rs(curEst.finalCost)})` : ""}`;
        }
        if (deskBtn) {
          deskBtn.textContent = `Pay at desk (${bk.h != null ? `Est. ${rs(curEst.finalCost)} · ` : ""}held ${tObj.holdMins} min)`;
        }
      } else if (e.target.id === "bn") {
        bk.name = e.target.value;
      } else if (e.target.id === "bpin") {
        bk.pin = e.target.value;
      } else if (e.target.id === "cafe-phone") {
        cafeOrder.phone = e.target.value.trim();
        if (cafeOrder.phone.length === 10 || cafeOrder.phone.length === 0) {
          render();
          const inputEl = $("#cafe-phone");
          if (inputEl) {
            inputEl.focus();
            inputEl.setSelectionRange(inputEl.value.length, inputEl.value.length);
          }
        }
      }
    });

    
    document.addEventListener("keydown", (e) => {
      const tag = (e.target?.tagName || "").toLowerCase();
      
      if (e.key !== "Enter") return;
      if (e.target.id === "pin") login();
      if (e.target.id === "si-id" || e.target.id === "si-pin") {
        const siBtn = $('[data-action="submit-signin"]');
        if (siBtn) siBtn.click();
      }
      if (["su-account", "su-phone", "su-name", "su-riot", "su-email", "su-pin"].includes(e.target.id)) {
        const suBtn = $('[data-action="submit-signup"]');
        if (suBtn) suBtn.click();
      }
      if (["bn", "bp", "bpin"].includes(e.target.id)) {
        const bkBtn = $("#book-btn-desk") || $("#book-btn-wallet");
        if (bkBtn) bkBtn.click();
      }
      if (e.target.id === "rp" || e.target.id === "rpin") {
        const lookupBtn = $('[data-action="lookup-rewards"]');
        if (lookupBtn) lookupBtn.click();
      }
    });

    
    // Live ticking stopwatch for PC Trackers and PS Trackers (Sheets 6 & 7)
    setInterval(() => {
      if (view === "staff" && ok) {
        document.querySelectorAll("[data-excel-stopwatch]").forEach((span) => {
          const startMs = Number(span.getAttribute("data-start-ms"));
          if (startMs && startMs > 0) {
            const elapsedSec = Math.max(0, Math.floor((now() - startMs) / 1000));
            const hh = Math.floor(elapsedSec / 3600);
            const mm = Math.floor((elapsedSec % 3600) / 60);
            const ss = elapsedSec % 60;
            span.textContent = `${String(hh).padStart(2, "0")}:${String(mm).padStart(2, "0")}:${String(ss).padStart(2, "0")}`;
          }
        });
      }
    }, 1000);
setInterval(() => {
      if (view === "staff" && ok) {
        checkStaffSessionTimeout();
        if (!ok) {
          render();
          return;
        }
        document.querySelectorAll("[data-rig-timer]").forEach((span) => {
          const rigId = span.getAttribute("data-rig-timer");
          const s = S.rigs[rigId];
          if (s) {
            span.textContent = Math.max(0, Math.floor((now() - s.s) / 6e4)) + " min";
          }
        });
      }
    }, 15000);

    
    window.addEventListener("hashchange", () => {
      const next = location.hash.slice(1);
      const t = VALID_VIEWS.has(next) ? next : "home";
      if (t !== view) go(t);
    });

    (function () {
      const bg = document.createElement("div");
      bg.id = "vz-bg3d"; bg.setAttribute("aria-hidden", "true");
      const F = ["rotateY(0deg)", "rotateY(90deg)", "rotateY(180deg)", "rotateY(270deg)", "rotateX(90deg)", "rotateX(-90deg)"];
      bg.innerHTML = '<div class="gr"></div>' + [["70px", "7%", "16%", "26s", ""], ["44px", "88%", "46%", "20s", ""], ["98px", "72%", "70%", "34s", " c3"]]
        .map(([s, x, y, t, c]) => `<div class="cb${c}" style="--s:${s};--x:${x};--y:${y};--t:${t}">${F.map((f) => `<b style="transform:${f} translateZ(calc(var(--s) / 2))"></b>`).join("")}</div>`).join("");
      document.body.prepend(bg);
    })();
    render();
    playIn();
  })();
  </script>
</body>
</html>
